# Backup service for PostgreSQL database
# This service runs a nightly pg_dump and uploads to Elastx Object Store
# Run with: docker-compose -f docker-compose.yml -f docker-compose.backup.yml up -d

services:
    db-backup:
        profiles:
            - backup
        image: ghcr.io/vasteras-stadsmission/matkassen-db-backup:${DB_BACKUP_IMAGE_TAG:-latest}
        restart: unless-stopped
        # Backup-only secrets (DB_BACKUP_PASSPHRASE, Swift credentials,
        # SWIFT_CONTAINER, SWIFT_PREFIX), written by scripts/write-env.sh on
        # production. They live outside .env because the web container loads
        # all of .env; an app compromise must not be able to read them.
        env_file:
            - .env.backup
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_HOST=db
            - ENV_NAME=${ENV_NAME}
            - TZ=Europe/Stockholm
            # Elastx OpenStack Object Store (hardcoded non-sensitive)
            - RCLONE_CONFIG_ELASTX_TYPE=swift
            - RCLONE_CONFIG_ELASTX_ENV_AUTH=true
            - OS_AUTH_TYPE=v3applicationcredential
            - OS_AUTH_URL=https://ops.elastx.cloud:5000/v3
            - OS_IDENTITY_API_VERSION=3
            - OS_INTERFACE=public
            - OS_REGION_NAME=se-sto
            - BACKUP_RETENTION_DAYS=14
            - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
            - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-}
            # gpg normally creates and writes state files (keyring, random
            # seed, socket dir) in ~/.gnupg. With read_only: true that
            # directory is unwritable and gpg aborts with
            # `can't create directory '/home/backupuser/.gnupg': Read-only
            # file system`. Pointing GNUPGHOME at the tmpfs /tmp mount
            # gives gpg a writable state dir per container run without
            # widening the filesystem write surface.
            - GNUPGHOME=/tmp/.gnupg
        depends_on:
            db:
                condition: service_healthy
        networks:
            - my_network
        # Security hardening
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            # Holds the encrypted dump during upload and the encrypted
            # download during validation (both ~size-of-compressed-dump).
            # Plaintext no longer touches tmpfs — the validation restore
            # goes straight into the scratch Postgres DB. 500m is generous
            # headroom for data growth; current usage is a few MB.
            - /tmp:noexec,nosuid,size=500m
        healthcheck:
            test: ["CMD", "pgrep", "supercronic"]
            interval: 60s
            start_period: 10s
            start_interval: 2s
            timeout: 10s
            retries: 3
        logging:
            driver: journald

networks:
    my_network:
        external: true
