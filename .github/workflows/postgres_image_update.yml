name: PostgreSQL image update

# Applies a PostgreSQL minor/patch image change from docker-compose.yml to the
# running database. Routine deploys never restart PostgreSQL, so this is the
# separate, scheduled step that does (docs/deployment-guide.md, "PostgreSQL
# Image Updates"). Staging runs first; production waits for environment
# approval. Approve it outside food-parcel handout hours: PostgreSQL restarts,
# which normally takes seconds.

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    staging:
        runs-on: ubuntu-latest
        # Shared with continuous_deployment.yml so a deploy and a database
        # update never run on the same host at once.
        concurrency:
            group: deploy-staging
            cancel-in-progress: false
        environment:
            name: staging
            url: https://staging.matcentralen.com
        steps:
            - name: Update PostgreSQL image on staging
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: ${{ secrets.SERVER_HOST_STAGING }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  fingerprint: ${{ vars.SERVER_SSH_FINGERPRINT }}
                  # The action's default of 10m is too short for a slow pull.
                  command_timeout: 30m
                  script: |
                      set -euo pipefail
                      export ENV_NAME="staging"
                      bash /home/ubuntu/matkassen/scripts/postgres-image-update.sh

    production:
        needs: staging
        runs-on: ubuntu-latest
        # Shared with continuous_deployment.yml. A job waiting for approval holds
        # the group, so a production deploy queues behind this job and vice
        # versa; reject whichever should not go first.
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        environment:
            name: production
            url: https://matcentralen.com
        steps:
            - name: Update PostgreSQL image on production
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: ${{ secrets.SERVER_HOST_PRODUCTION }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  fingerprint: ${{ vars.SERVER_SSH_FINGERPRINT }}
                  # Covers the pull and the pre-restart backup; the default is 10m.
                  command_timeout: 60m
                  script: |
                      set -euo pipefail
                      export ENV_NAME="production"
                      bash /home/ubuntu/matkassen/scripts/postgres-image-update.sh
