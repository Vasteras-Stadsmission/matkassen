name: Initial deploy to Elastx

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Target environment"
                required: true
                type: choice
                options:
                    - production
                    - staging
                default: "staging"

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy to ${{ github.event.inputs.environment }}
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Display target environment
              run: |
                  echo "=================================="
                  echo "DEPLOYING TO ${{ github.event.inputs.environment }} ENVIRONMENT"
                  echo "=================================="

            - name: Add to workflow summary
              run: |
                  echo "## 🚀 Deploying to ${{ github.event.inputs.environment }} environment" >> "$GITHUB_STEP_SUMMARY"

            - name: Deploy via SSH
              timeout-minutes: 10
              env:
                  TARGET: ${{ github.event.inputs.environment }}
                  SSH_HOST: ${{ github.event.inputs.environment == 'production' && secrets.SERVER_HOST_PRODUCTION || github.event.inputs.environment == 'staging' && secrets.SERVER_HOST_STAGING || '' }}
                  SSH_USER: ${{ secrets.SERVER_USER }}
                  SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
                  POSTGRES_PASSWORD: ${{ github.event.inputs.environment == 'production' && secrets.POSTGRES_PASSWORD_PRODUCTION || github.event.inputs.environment == 'staging' && secrets.POSTGRES_PASSWORD_STAGING || '' }}
                  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                  # Optional: set the DATABASE_SSL repo/environment secret to
                  # "require" or "verify-full" when the DB is managed/external.
                  # Leave unset for the current trusted-network Docker DB.
                  DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
                  DEPLOY_SHA: ${{ github.sha }}
                  EMAIL: ${{ secrets.EMAIL }}
                  AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
                  AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
                  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
                  AUTH_GITHUB_APP_ID: ${{ secrets.AUTH_GITHUB_APP_ID }}
                  AUTH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.AUTH_GITHUB_APP_PRIVATE_KEY }}
                  AUTH_GITHUB_APP_INSTALLATION_ID: ${{ secrets.AUTH_GITHUB_APP_INSTALLATION_ID }}
                  # Production-only secrets are selected here on the runner, so the
                  # staging server never receives them. A missing production secret
                  # stays empty instead of falling back to the staging value.
                  HELLO_SMS_USERNAME: ${{ github.event.inputs.environment == 'production' && secrets.HELLO_SMS_USERNAME || '' }}
                  HELLO_SMS_PASSWORD: ${{ github.event.inputs.environment == 'production' && secrets.HELLO_SMS_PASSWORD || '' }}
                  SMS_CALLBACK_SECRET: ${{ github.event.inputs.environment == 'production' && secrets.SMS_CALLBACK_SECRET || '' }}
                  DB_BACKUP_PASSPHRASE: ${{ github.event.inputs.environment == 'production' && secrets.DB_BACKUP_PASSPHRASE || '' }}
                  OS_APPLICATION_CREDENTIAL_ID: ${{ github.event.inputs.environment == 'production' && secrets.OS_APPLICATION_CREDENTIAL_ID || '' }}
                  OS_APPLICATION_CREDENTIAL_SECRET: ${{ github.event.inputs.environment == 'production' && secrets.OS_APPLICATION_CREDENTIAL_SECRET || '' }}
                  SWIFT_CONTAINER: ${{ github.event.inputs.environment == 'production' && secrets.SWIFT_CONTAINER || '' }}
                  HEALTHCHECKS_PING_KEY: ${{ github.event.inputs.environment == 'production' && secrets.HEALTHCHECKS_PING_KEY || '' }}
              run: |
                  vars="POSTGRES_PASSWORD POSTGRES_USER POSTGRES_DB DATABASE_SSL DEPLOY_SHA EMAIL
                      AUTH_GITHUB_ID AUTH_GITHUB_SECRET AUTH_SECRET
                      AUTH_GITHUB_APP_ID AUTH_GITHUB_APP_PRIVATE_KEY AUTH_GITHUB_APP_INSTALLATION_ID"
                  if [ "$TARGET" = "production" ]; then
                      vars="$vars HELLO_SMS_USERNAME HELLO_SMS_PASSWORD SMS_CALLBACK_SECRET DB_BACKUP_PASSPHRASE
                          OS_APPLICATION_CREDENTIAL_ID OS_APPLICATION_CREDENTIAL_SECRET SWIFT_CONTAINER
                          HEALTHCHECKS_PING_KEY"
                  fi
                  # shellcheck disable=SC2086 # $vars is a list of names
                  .github/scripts/remote-run.sh "$TARGET" TARGET $vars <<'REMOTE'
                      # Fail fast on errors (defense in depth — init_deploy re-clones so
                      # the stale-branch bug doesn't apply, but strict mode is the right
                      # default for deploy scripts).
                      set -euo pipefail

                      export GITHUB_ORG="vasteras-stadsmission"
                      export ENV_NAME="$TARGET"
                      export APP_IMAGE_TAG="sha-${DEPLOY_SHA}"
                      export DB_BACKUP_IMAGE_TAG="sha-${DEPLOY_SHA}"

                      if [ "$ENV_NAME" == "production" ]; then
                        export SMS_SENDER="Matcentral"
                        export HELLO_SMS_TEST_MODE="false"
                        export SMS_SEND_INTERVAL="5 minutes"
                        export LOG_LEVEL="info"
                        export DOMAIN_NAME="matcentralen.com"
                        export BRAND_NAME="Matcentralen"
                        export ANONYMIZATION_SCHEDULE="0 2 * * 0"
                        export ANONYMIZATION_INACTIVE_DURATION="1 year"
                        export ORG_SYNC_SCHEDULE="0 3 * * *"
                        # OpenStack Swift (env_auth) for backups - hardcoded non-sensitive values.
                        # All five hardcoded vars are explicit (not relying on deploy.sh's
                        # defaults) so the workflow is self-documenting and matches
                        # continuous_deployment.yml's exports.
                        export OS_AUTH_TYPE=v3applicationcredential
                        export OS_AUTH_URL=https://ops.elastx.cloud:5000/v3
                        export OS_REGION_NAME=se-sto
                        export OS_INTERFACE=public
                        export OS_IDENTITY_API_VERSION=3
                      else
                        export DOMAIN_NAME="staging.matcentralen.com"
                        export BRAND_NAME="Matcentralen"
                        export LOG_LEVEL="debug"
                        export HELLO_SMS_TEST_MODE="true"
                        export SMS_SEND_INTERVAL="30 seconds"
                        export ANONYMIZATION_SCHEDULE="*/15 * * * *"
                        export ANONYMIZATION_INACTIVE_DURATION="365 days"
                        export ORG_SYNC_SCHEDULE="0 3 * * *"
                        # SMS credentials not needed in staging (test mode only)
                        # Backups disabled on staging by policy (no DB_BACKUP_PASSPHRASE exported)
                      fi

                      echo "Setting DOMAIN_NAME to $DOMAIN_NAME"
                      echo "Setting BRAND_NAME to $BRAND_NAME"

                      # Derive Swift prefix from env name
                      export SWIFT_PREFIX="backups/${ENV_NAME}"

                      # Explicit path rather than `~/matkassen`. The deploy runs
                      # this as the `ubuntu` user so `~` would resolve correctly,
                      # but hardcoding removes the fragility if anyone ever wraps
                      # a command in sudo.
                      APP_DIR="/home/ubuntu/matkassen"

                      echo "Checking if app directory exists"
                      if [ -d "$APP_DIR" ]; then
                        echo "Directory exists, removing it"
                        rm -rf "$APP_DIR"
                      fi

                      # Create the directory with owner-only perms BEFORE git
                      # clone, so the repo lands in an already-hardened dir.
                      # git clone into an existing empty directory is supported.
                      sudo install -d -m 700 -o ubuntu -g ubuntu "$APP_DIR"

                      echo "Cloning the repository at workflow commit ${DEPLOY_SHA}"
                      git clone --depth 1 --no-checkout https://github.com/Vasteras-Stadsmission/matkassen.git "$APP_DIR"

                      echo "Change directory to the app folder"
                      cd "$APP_DIR"

                      # The workflow may wait for environment approval while main moves
                      # forward. Fetch and check out this run's exact commit so the repo,
                      # deployment scripts, migrations, and sha-* images stay aligned.
                      git fetch --depth 1 origin "$DEPLOY_SHA"
                      git checkout --detach "$DEPLOY_SHA"
                      ACTUAL_SHA="$(git rev-parse HEAD)"
                      if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
                        echo "❌ VPS checkout mismatch: got $ACTUAL_SHA, expected $DEPLOY_SHA"
                        exit 1
                      fi
                      echo "HEAD: $ACTUAL_SHA  (workflow SHA: $DEPLOY_SHA)"

                      echo "Run the deploy script"
                      chmod +x deploy.sh
                      # `set -euo pipefail` above means a non-zero exit aborts the
                      # whole script, so the explicit status check is redundant.
                      ./deploy.sh
                      echo "✅ Successfully deployed the application to the VPS."
                  REMOTE
