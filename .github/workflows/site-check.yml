name: Site check

# Checks production's /api/health from outside every 15 minutes and reports
# the result to the `site` check on healthchecks.io, which emails when the
# site is down or unhealthy. If this workflow stops running (GitHub outage, or
# GitHub disabling scheduled workflows after 60 days without repo activity),
# the missing pings alert too.
#
# Up to 4 tries 30 s apart, so a deploy restarting the web container does not
# alert. The job passes even when the site is down: healthchecks.io sends the
# alert, and a failing run would make GitHub email on every run as well.

on:
    schedule:
        # Off the full hour, when GitHub delays scheduled runs the most.
        - cron: "7,22,37,52 * * * *"
    workflow_dispatch:

permissions: {}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check /api/health and report to healthchecks.io
              env:
                  PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
              run: |
                  suffix="/fail"
                  for attempt in 1 2 3 4; do
                      status=$(curl -sS -m 20 https://matcentralen.com/api/health | jq -r '.status // empty') || status=""
                      echo "try ${attempt}: ${status:-unreachable}"
                      if [ "$status" = "healthy" ]; then
                          suffix=""
                          break
                      fi
                      if [ "$attempt" -lt 4 ]; then
                          sleep 30
                      fi
                  done
                  curl -fsS -m 10 --retry 3 -o /dev/null -X POST "https://hc-ping.com/${PING_KEY}/site${suffix}"
